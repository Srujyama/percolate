# Push a tag like v1.0.0 to build Percolate.app and attach it to a GitHub Release.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build
        run: ./build.sh
      - name: Zip
        run: ditto -c -k --keepParent build/Percolate.app build/Percolate.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Percolate
          path: build/Percolate.zip
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/Percolate.zip --title "Percolate $GITHUB_REF_NAME" --generate-notes
