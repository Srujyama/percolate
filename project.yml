name: Percolate
options:
  bundleIdPrefix: io.github.srujyama
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: YES
targets:
  Percolate:
    type: application
    platform: macOS
    sources:
      - path: Percolate/Sources
      - path: Percolate/Resources
    info:
      path: Percolate/Info.plist
      properties:
        CFBundleDisplayName: Percolate
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.utilities
        NSAppleScriptEnabled: true
        OSAScriptingDefinition: Percolate.sdef
        NSHumanReadableCopyright: "MIT License"
        CFBundleURLTypes:
          - CFBundleURLName: io.github.srujyama.Percolate
            CFBundleURLSchemes: [percolate]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.srujyama.Percolate
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        COMBINE_HIDPI_IMAGES: YES
